<div class="pareto-wrapper">
  <div class="background-shapes"></div>

  <div class="pareto-card">
    <h2 class="title">Diagrama de Pareto - Tabla</h2>

    <div *ngIf="items.length === 0" class="empty">
      No hay datos suficientes.
    </div>

    <table *ngIf="items.length > 0" class="pareto-table">
      <thead>
        <tr>
          <th>Causa</th>
          <th>Puntuación</th>
          <th>% Total</th>
          <th>% Acumulado</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items" [ngClass]="{'highlight': item.highlight}">
          <td>{{item.name}}</td>
          <td>{{item.impact}}</td>
          <td>{{item.percentage | number:'1.1-1'}}%</td>
          <td>{{item.cumulative | number:'1.1-1'}}%</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
