<div class="selector-wrapper">
  <div class="background-shapes"></div>

  <div class="selector-card">
    <h2 class="title">Selecciona el tipo de diagrama</h2>

    <div class="grid">

      <div class="diagram-card" (click)="goTo('foda')">
        <h3>FODA</h3>
        <p>Fortalezas, Oportunidades, Debilidades y Amenazas.</p>
      </div>

      <div class="diagram-card" (click)="goTo('catwda')">
        <h3>CATWDA</h3>
        <p>Análisis sistémico de actores y transformación.</p>
      </div>

      <div class="diagram-card" (click)="goTo('sombreros')">
        <h3>6 Sombreros</h3>
        <p>Evaluación desde múltiples perspectivas.</p>
      </div>

      <div class="diagram-card" (click)="goTo('ishikawa')">
        <h3>Ishikawa</h3>
        <p>Diagrama causa-efecto estructurado.</p>
      </div>

      <div class="diagram-card" (click)="goTo('pareto')">
        <h3>Pareto</h3>
        <p>Priorización basada en impacto.</p>
      </div>

    </div>

  </div>
</div>
